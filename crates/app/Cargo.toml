[package]
name = "lyrics-overlay"
description = "Floating desktop lyrics for the Spotify desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = { version = "0.4", features = ["std"] }
lyrics-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Serve the bundled ui/ folder; there is no dev server.
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Re-asserting "always on top" (see topmost.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

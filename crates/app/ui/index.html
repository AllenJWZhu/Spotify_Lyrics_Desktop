<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyrics Overlay</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="overlay.js"></script>
  </head>
  <body>
    <!-- Anything carrying data-tauri-drag-region moves the window when
         dragged; lyric text ignores the pointer so its container is hit. -->
    <main id="stage" data-tauri-drag-region>
      <nav id="toolbar" aria-label="Controls" data-tauri-drag-region>
        <div class="group">
          <button type="button" data-action="previous" title="Previous">
            <svg class="solid" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 5.5v13a1 1 0 0 1-1.5.9l-9.6-6.5a1 1 0 0 1 0-1.7l9.6-6.5a1 1 0 0 1 1.5.8Z" />
              <rect x="4.5" y="5" width="2.2" height="14" rx="1.1" />
            </svg>
          </button>
          <button type="button" data-action="playPause" id="play-pause" title="Play or pause">
            <svg class="solid icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.2v13.6a1 1 0 0 0 1.5.9l10.4-6.8a1 1 0 0 0 0-1.7L9.5 4.3A1 1 0 0 0 8 5.2Z" />
            </svg>
            <svg class="solid icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6.5" y="5" width="3.6" height="14" rx="1.2" />
              <rect x="13.9" y="5" width="3.6" height="14" rx="1.2" />
            </svg>
          </button>
          <button type="button" data-action="next" title="Next">
            <svg class="solid" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 5.5v13a1 1 0 0 0 1.5.9l9.6-6.5a1 1 0 0 0 0-1.7L7.5 4.7A1 1 0 0 0 6 5.5Z" />
              <rect x="17.3" y="5" width="2.2" height="14" rx="1.1" />
            </svg>
          </button>
        </div>

        <div class="group">
          <button type="button" data-action="fontDown" title="Smaller text">
            <span class="glyph glyph-small" aria-hidden="true">A</span>
          </button>
          <button type="button" data-action="fontUp" title="Larger text">
            <span class="glyph" aria-hidden="true">A</span>
          </button>
          <button type="button" data-action="theme" title="Change colour">
            <span class="swatch" aria-hidden="true"></span>
          </button>
        </div>

        <div class="group" role="group" aria-label="Lyric timing">
          <button type="button" data-action="offsetDown" title="Show lyrics later">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10" /></svg>
          </button>
          <button type="button" data-action="offsetReset" id="offset" title="Lyric timing. Click to reset">0.0s</button>
          <button type="button" data-action="offsetUp" title="Show lyrics earlier">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10M12 7v10" /></svg>
          </button>
        </div>

        <div class="group">
          <button type="button" data-action="lock" title="Lock so clicks pass through (Ctrl+Alt+L)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
              <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" />
            </svg>
          </button>
          <button type="button" data-action="close" class="close" title="Quit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
          </button>
        </div>
      </nav>

      <section id="lyrics" data-tauri-drag-region>
        <div id="primary" class="line primary">
          <span class="layer outline"></span>
          <span class="layer base"></span>
          <span class="layer sung"></span>
        </div>
        <div id="secondary" class="line secondary">
          <span class="layer outline"></span>
          <span class="layer base"></span>
        </div>
      </section>

      <!-- Shown while locked and the pointer is over the window. The app
           lets clicks through everywhere except over this button. -->
      <button type="button" id="unlock" data-action="unlock" title="Unlock (Ctrl+Alt+L)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
          <path d="M8.5 10.5V8a3.5 3.5 0 0 1 6.6-1.6" />
        </svg>
        <span>Unlock</span>
      </button>
    </main>
  </body>
</html>

name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and a portable zip
# and creates a *draft* GitHub release with them; publish it by hand after a
# look. Pull requests that change the app build the same files as a dry run
# without releasing anything, so the installer can be tried before merging
# (download from the run page).
#
# In-app updates: the installer is signed with the updater key (repository
# secrets TAURI_SIGNING_PRIVATE_KEY / _PASSWORD) and latest.json describes
# it. Installed copies read latest.json from the *latest published* release,
# so nothing reaches users until the draft is published.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lyrics-overlay") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the crate version $version"
            exit 1
          fi

      - name: Build installer
        working-directory: crates/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # Also writes the installer's .sig for the updater.
            npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --ci \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't set; a release without it can't update installed copies"
            exit 1
          else
            echo "::notice::No updater key (e.g. a PR from a fork); building without update signatures"
            npx --yes "@tauri-apps/cli@$TAURI_CLI_VERSION" build --ci
          fi

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist portable
          cp target/release/bundle/nsis/*-setup.exe "dist/LyricsOverlay-$VERSION-setup.exe"
          cp target/release/lyrics-overlay.exe portable/LyricsOverlay.exe
          (cd portable && 7z a -bso0 "../dist/LyricsOverlay-$VERSION-portable.zip" LyricsOverlay.exe)
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

          # The updater's manifest, if the installer was signed.
          sig=$(ls target/release/bundle/nsis/*-setup.exe.sig 2>/dev/null | head -1)
          if [ -n "$sig" ]; then
            # Will installed copies (which trust the key in tauri.conf.json) accept it?
            node .github/scripts/verify-update-signature.mjs \
              "dist/LyricsOverlay-$VERSION-setup.exe" "$sig" crates/app/tauri.conf.json
            awk -v v="$VERSION" '
              /^## / { inside = index($0, "[" v "]") > 0; next }
              inside
            ' CHANGELOG.md > notes.md
            .github/scripts/updater-manifest.sh "$VERSION" windows-x86_64 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/LyricsOverlay-$VERSION-setup.exe" \
              "$sig" notes.md > dist/latest.json
            jq '.platforms' dist/latest.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-overlay-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Notes are this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '
            /^## / { inside = index($0, "[" v "]") > 0; next }
            inside
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          [ -f dist/latest.json ] || { echo "::error::No latest.json; installed copies wouldn't see this release"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "Lyrics Overlay $VERSION" \
            --notes-file notes.md

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the real target; Linux keeps the platform-independent
        # core honest.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies
        # The overlay builds on Linux too (in demo mode); it needs WebKitGTK.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Overlay UI tests
        if: runner.os == 'Linux'
        run: node --test "crates/app/tests-js/*.test.mjs"

      - name: Build release binaries
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p lyrics-cli -p lyrics-overlay
      - name: Upload overlay
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-overlay-windows
          path: target/release/lyrics-overlay.exe
      - name: Upload CLI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-cli-windows
          path: target/release/lyrics-cli.exe

  lrclib-live:
    # Calls the real LRCLIB API on Windows (OS certificate store, system
    # proxy). Informational: an outage there must not block merges.
    name: LRCLIB live (informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live lookups
        run: cargo test -p lyrics-core --test lrclib_live --locked -- --ignored --nocapture --test-threads=1

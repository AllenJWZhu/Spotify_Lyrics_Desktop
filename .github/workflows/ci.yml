name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the real target; Linux keeps the platform-independent
        # core honest.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

      - name: Build release CLI
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p lyrics-cli
      - name: Upload CLI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-cli-windows
          path: target/release/lyrics-cli.exe

  lrclib-live:
    # Calls the real LRCLIB API on Windows (OS certificate store, system
    # proxy). Informational: an outage there must not block merges.
    name: LRCLIB live (informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live lookups
        run: cargo test -p lyrics-core --test lrclib_live --locked -- --ignored --nocapture --test-threads=1

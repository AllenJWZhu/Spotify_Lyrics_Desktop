[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app", "crates/setup"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AllenJWZhu/Spotify_Lyrics_Desktop"

[workspace.dependencies]
lyrics-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"
# platform-verifier: trust the OS certificate store (works behind antivirus
# TLS inspection). win-system-proxy: honor the proxy set in Windows settings.
ureq = { version = "3", features = ["json", "platform-verifier", "win-system-proxy"] }
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_System_WinRT"] }
